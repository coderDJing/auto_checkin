name: iKuuu daily check-in

on:
  schedule:
    - cron: '0 22 * * *' # 06:00 Beijing time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check in
        env:
          RUN_ENV: prod
          IKUUU_BASE_URL: https://ikuuu.top
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
        run: python main.py
